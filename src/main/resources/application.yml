server:
  servlet:
    context-path: /agent
  port: 8080


spring:
  application:
    name: agent-student
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:}"
      base-url: https://api.xiaomimimo.com
      chat:
        model: mimo-v2.6-flash
        temperature: 0.3
        reasoning-effort: high
    chat:
      client:
        enabled: false

logging:
  level:
    org.springframework.ai: DEBUG


  # ==================== H2 内存数据库（会话记忆持久化） ====================
  datasource:
    url: jdbc:h2:mem:agent_chat_memory;MODE=LEGACY;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-chat-memory.sql



