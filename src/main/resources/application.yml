server:
  servlet:
    context-path: /agent
  port: 8080


spring:
  application:
    name: agent-student
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:}"
      base-url: https://api.xiaomimimo.com/v1
      chat:
        model: mimo-v2.6-flash
        temperature: 0.3
        reasoning-effort: high
      embedding:
        model: qwen3.7-text-embedding
        base-url: https://ws-lcxyjnbzvs71q5ma.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: "${DASHSCOPE_API_KEY:}"
    chat:
      client:
        enabled: false
    mcp:
      client:
        type: sync
        enabled: true
        streamable-http:
          connections:
            mcp-server:
              url: http://localhost:8888
    vectorstore:
      milvus:
        client:
          host: "localhost"
          port: 19530
          username: "root"
          password: "milvus"
        databaseName: "default"
        collectionName: "test_vector_store"
        embeddingDimension: 1024
        indexType: IVF_FLAT
        metricType: COSINE
        initialize-schema: true
logging:
  level:
    org.springframework.ai: DEBUG


  # ==================== H2 内存数据库（会话记忆持久化） ====================
  datasource:
    url: jdbc:h2:mem:agent_chat_memory;MODE=LEGACY;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-chat-memory.sql



